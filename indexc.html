<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Translator Reyga - Cerdas & Cepat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass-morphism {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="bg-blue-600 p-2 rounded-lg">
                    <i class="fas fa-language text-white text-xl"></i>
                </div>
                <h1 class="text-xl font-bold text-slate-800">AI<span class="text-blue-600">Translate</span></h1>
            </div>
            <div id="status-indicator" class="text-xs font-medium text-slate-400 hidden sm:block">
                Ditenagai oleh Gemini AI
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container max-w-6xl mx-auto px-4 py-6 md:py-10">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 md:gap-6">
            
            <!-- Input Area -->
            <div class="space-y-4">
                <div class="flex items-center justify-between bg-white p-2 rounded-xl shadow-sm border">
                    <select id="source-lang" class="bg-transparent font-medium text-slate-700 px-3 py-1 outline-none cursor-pointer">
                        <option value="auto">Deteksi Bahasa</option>
                        <option value="id">Indonesia</option>
                        <option value="en">Inggris</option>
                        <option value="jp">Jepang</option>
                        <option value="kr">Korea</option>
                        <option value="ar">Arab</option>
                        <option value="fr">Prancis</option>
                        <option value="de">Jerman</option>
                    </select>
                    <button id="clear-btn" class="text-slate-400 hover:text-red-500 transition-colors px-2">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="relative group">
                    <textarea id="source-text" 
                        class="w-full h-48 md:h-64 p-5 rounded-2xl border bg-white shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-lg resize-none transition-all"
                        placeholder="Ketik teks di sini..."></textarea>
                    <div class="absolute bottom-4 right-4 flex space-x-2">
                        <button id="voice-input-btn" class="w-10 h-10 rounded-full bg-slate-100 text-slate-600 hover:bg-blue-50 hover:text-blue-600 flex items-center justify-center transition-all">
                            <i class="fas fa-microphone"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Output Area -->
            <div class="space-y-4">
                <div class="flex items-center justify-between bg-white p-2 rounded-xl shadow-sm border">
                    <select id="target-lang" class="bg-transparent font-medium text-slate-700 px-3 py-1 outline-none cursor-pointer">
                        <option value="en">Inggris</option>
                        <option value="id">Indonesia</option>
                        <option value="jp">Jepang</option>
                        <option value="kr">Korea</option>
                        <option value="ar">Arab</option>
                        <option value="fr">Prancis</option>
                        <option value="de">Jerman</option>
                        <option value="es">Spanyol</option>
                    </select>
                    <div class="flex items-center space-x-1">
                        <button id="copy-btn" class="p-2 text-slate-400 hover:text-blue-600" title="Salin">
                            <i class="fas fa-copy"></i>
                        </button>
                        <button id="tts-btn" class="p-2 text-slate-400 hover:text-blue-600" title="Dengarkan">
                            <i class="fas fa-volume-up"></i>
                        </button>
                    </div>
                </div>
                <div id="result-container" class="relative">
                    <div id="target-text" 
                        class="w-full h-48 md:h-64 p-5 rounded-2xl border bg-slate-100/50 shadow-inner text-lg overflow-y-auto text-slate-800 empty:before:content-['Terjemahan_akan_muncul_di_sini...'] empty:before:text-slate-400"></div>
                    
                    <!-- Loading Spinner -->
                    <div id="loader" class="absolute inset-0 flex items-center justify-center bg-white/60 rounded-2xl hidden">
                        <div class="flex flex-col items-center">
                            <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                            <p class="mt-2 text-sm font-medium text-blue-600">Berpikir...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Button (Mobile) -->
        <div class="mt-8 flex justify-center">
            <button id="translate-btn" class="w-full md:w-auto px-8 py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-2xl shadow-lg shadow-blue-200 transition-all transform active:scale-95 flex items-center justify-center space-x-3">
                <i class="fas fa-magic"></i>
                <span>Terjemahkan dengan AI</span>
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-slate-400 text-sm">
        <p>&copy; 2024 AI Translate. Dibuat untuk kemudahan komunikasi global.</p>
    </footer>

    <script>
        const apiKey = "AIzaSyB82pvDPVUpEyr1p2DuDTn7NQ8hOa7ww1Q"; // Diset otomatis oleh lingkungan
        const sourceText = document.getElementById('source-text');
        const targetText = document.getElementById('target-text');
        const sourceLang = document.getElementById('source-lang');
        const targetLang = document.getElementById('target-lang');
        const translateBtn = document.getElementById('translate-btn');
        const loader = document.getElementById('loader');
        const clearBtn = document.getElementById('clear-btn');
        const copyBtn = document.getElementById('copy-btn');
        const ttsBtn = document.getElementById('tts-btn');

        // Fungsi Translate Menggunakan Gemini
        async function translateText() {
            const text = sourceText.value.trim();
            if (!text) return;

            loader.classList.remove('hidden');
            const sl = sourceLang.value === 'auto' ? 'detect automatically' : sourceLang.value;
            const tl = targetLang.value;

            const prompt = `Translate the following text from ${sl} to ${tl}. 
            Provide only the translated text without any explanations or quotes.
            Text: ${text}`;

            let retries = 5;
            let delay = 1000;

            while (retries > 0) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }]
                        })
                    });

                    if (!response.ok) throw new Error('API limit or error');

                    const data = await response.json();
                    const translated = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    targetText.innerText = translated || "Gagal menerjemahkan.";
                    loader.classList.add('hidden');
                    return;
                } catch (error) {
                    retries--;
                    if (retries === 0) {
                        alert("Terjadi kesalahan saat menghubungi AI. Silakan coba lagi nanti.");
                        loader.classList.add('hidden');
                    }
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2;
                }
            }
        }

        // Event Listeners
        translateBtn.addEventListener('click', translateText);

        clearBtn.addEventListener('click', () => {
            sourceText.value = '';
            targetText.innerText = '';
        });

        copyBtn.addEventListener('click', () => {
            if (!targetText.innerText) return;
            const el = document.createElement('textarea');
            el.value = targetText.innerText;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            
            const originalIcon = copyBtn.innerHTML;
            copyBtn.innerHTML = '<i class="fas fa-check text-green-500"></i>';
            setTimeout(() => copyBtn.innerHTML = originalIcon, 2000);
        });

        ttsBtn.addEventListener('click', () => {
            const text = targetText.innerText;
            if (!text) return;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = targetLang.value;
            window.speechSynthesis.speak(utterance);
        });

        // Auto-translate on typing (with debounce)
        let debounceTimer;
        sourceText.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                if(sourceText.value.length > 3) translateText();
            }, 1500);
        });
    </script>
</body>
</html>
